name: Bump idfkit

# Adopt a newly published idfkit, as a pull request.
#
# idfkit's notify-downstream.yml dispatches this on every release, in the wave order the consumer
# register (governance/consumers.toml in idfkit-conformance) gives it; a maintainer may also run it by
# hand. It pins the version, relocks, runs the tests, lets Claude attempt a minimal repair when they
# fail, and opens a pull request. That part is unchanged: it works.
#
# Feature 004 of the unification added three things, each because an adoption could otherwise report
# complete while something it made false stood unexamined:
#
#   Statements. Every `idfkit:unavailable` marker in this repository rests on a parity ledger entry.
#     When the new level closes that entry, the statement beside the marker has become false. The
#     markers resting on an entry that moved to complete between the old level's governance tag and
#     the new one are listed in the pull request, which opens as a draft, and this run fails while any
#     is listed (FR-025). Reviewing one is removing the statement, or setting its `own_reason`.
#   The register. When the register holds a lag for this repository, the adoption closes it, and the
#     register change lands with the adoption rather than afterwards (FR-023) as a paired pull request
#     in idfkit-conformance. A level moving needs no register change at all otherwise, because the
#     register points at pyproject.toml rather than holding the level.
#   Declining. A maintainer who will not take a level runs this with `decline_reason`. Nothing is
#     bumped; the register records a deliberate lag with that reason, which is a resting state rather
#     than a bot pull request left open for a month (FR-024).
#
# The register and the ledger are read at the governance tag this repository pins in main.yml, never
# at a branch. Dispatching to idfkit-conformance uses a token the organisation's GitHub App mints for
# that one repository (APP_ID, APP_PRIVATE_KEY); without them the exact command is written where a
# maintainer will see it.

on:
  workflow_dispatch:
    inputs:
      idfkit_version:
        description: The published idfkit version to adopt, with or without a leading v.
        required: true
        type: string
      decline_reason:
        description: >
          Leave empty to adopt. To decline this level instead, state why as a policy, never a
          version. Nothing is bumped, and the register records a deliberate lag.
        required: false
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: write
  id-token: write

env:
  CONSUMER: idfkit-mcp
  LIBRARY: python
  GOVERNANCE_LEVEL: governance-2026.18

jobs:
  decline:
    if: inputs.decline_reason != ''
    runs-on: ubuntu-latest
    env:
      HAS_APP: ${{ secrets.APP_ID != '' && secrets.APP_PRIVATE_KEY != '' }}
    steps:
      # The consumer register lives in idfkit-conformance, so recording an adoption there is a dispatch
      # into another repository. The organisation's GitHub App (idfkit-bot) mints a token for that one
      # repository, valid for an hour, rather than a personal token stored for months. Without APP_ID
      # and APP_PRIVATE_KEY this step is skipped and the steps below say what to run instead.
      - name: Mint a token that can dispatch in idfkit-conformance
        id: app-token
        if: env.HAS_APP == 'true'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: idfkit-conformance
      - name: Record the decline in the consumer register
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REASON: ${{ inputs.decline_reason }}
          RAW_VERSION: ${{ inputs.idfkit_version }}
        run: |
          set -euo pipefail
          version="${RAW_VERSION#v}"
          command=(gh workflow run record-adoption.yml --repo idfkit/idfkit-conformance
                   -f consumer="$CONSUMER" -f library="$LIBRARY" -f outcome=decline -f reason="$REASON")
          printf '## %s declines idfkit %s\n\nReason: %s\n' "$CONSUMER" "$version" "$REASON" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${GH_TOKEN:-}" ]; then
            "${command[@]}"
            echo "Dispatched record-adoption.yml in idfkit-conformance; its pull request records the deliberate lag." >> "$GITHUB_STEP_SUMMARY"
          else
            printf '\nNot recorded: APP_ID and APP_PRIVATE_KEY are not set. Run:\n\n```\n%s\n```\n' "$(printf '%q ' "${command[@]}")" >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Decline not recorded::A decline the register does not hold is not a decline. Run the command in the step summary."
            exit 1
          fi

  bump:
    if: inputs.decline_reason == ''
    runs-on: ubuntu-latest
    env:
      HAS_APP: ${{ secrets.APP_ID != '' && secrets.APP_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize version
        id: ver
        env:
          RAW_VERSION: ${{ inputs.idfkit_version }}
        run: |
          set -euo pipefail
          version="${RAW_VERSION#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Normalized version: $version"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Read the level this adoption moves from
        id: prev
        run: |
          set -euo pipefail
          previous=$(python3 - <<'PY'
          import pathlib, re, tomllib
          dependencies = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["dependencies"]
          pins = [d.split("==", 1)[1].strip() for d in dependencies if re.match(r"idfkit\s*==", d)]
          if len(pins) != 1:
              raise SystemExit(f"expected one exact idfkit pin in pyproject.toml, found {pins}")
          print(pins[0])
          PY
          )
          echo "level=$previous" >> "$GITHUB_OUTPUT"
      - name: Bump idfkit
        run: |
          uv add "idfkit==${{ steps.ver.outputs.version }}"
          uv lock
      - name: Read the register and the ledger at the pinned governance tag
        uses: actions/checkout@v4
        with:
          repository: idfkit/idfkit-conformance
          ref: refs/tags/${{ env.GOVERNANCE_LEVEL }}
          fetch-depth: 0
          path: .governance
          persist-credentials: false
      # Out of this repository's tree: the pull request below commits every change in it, and pytest
      # would collect the governance repository's own tests.
      - name: Move the governance checkout aside
        run: mv .governance "$RUNNER_TEMP/governance"
      - name: List the statements this adoption surfaces
        id: statements
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS: ${{ steps.prev.outputs.level }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set +e
          python3 "$RUNNER_TEMP/governance/tools/adoption_statements.py" --library "$LIBRARY" \
            --from "$PREVIOUS" --to "$VERSION" --root . --conformance "$RUNNER_TEMP/governance" \
            > "$RUNNER_TEMP/statements.txt" 2>&1
          code=$?
          set -e
          cat "$RUNNER_TEMP/statements.txt"
          if [ "$code" -ge 2 ]; then
            echo "::error title=Statements unknown::The governance levels of idfkit $PREVIOUS and $VERSION could not be read, so the statements this adoption surfaces are unknown. That is not the same as none."
            exit 2
          fi
          if [ "$code" -eq 1 ]; then echo "surfaced=true" >> "$GITHUB_OUTPUT"; else echo "surfaced=false" >> "$GITHUB_OUTPUT"; fi
      # T119, FR-023: an adoption closes the register's lag only when it reaches the library's current
      # level, the newest release of any kind. A bump to anything older, a manual dispatch of an earlier
      # release say, moves the consumer forward and leaves it behind all the same, so the lag stays open.
      # This step is identical in every consumer's bump workflow; change it everywhere or nowhere.
      - name: Read whether the adopted level is the library's current level
        id: current
        env:
          ADOPTED: ${{ steps.ver.outputs.version }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re, urllib.request

          def norm(v):
              v = v.strip().lower().removeprefix("v")
              return re.sub(r"[.-]?(alpha|beta|a|b|rc|dev|post)[.-]?(\d*)", lambda m: {"alpha": "a", "beta": "b"}.get(m[1], m[1]) + m[2], v)

          def key(v):
              base, _, pre = norm(v).partition("rc")
              nums = [int(x) for x in re.findall(r"\d+", re.split(r"[a-z]", base, maxsplit=1)[0])]
              return (*nums, 0 if pre else 1, int(pre) if pre.isdigit() else 0)

          if os.environ["LIBRARY"] == "python":
              data = json.load(urllib.request.urlopen("https://pypi.org/pypi/idfkit/json", timeout=30))
              versions = [v for v, files in data["releases"].items() if files]
          else:
              data = json.load(urllib.request.urlopen("https://registry.npmjs.org/@idfkit%2Fcore", timeout=30))
              versions = list(data["versions"])
          current = max(versions, key=key)
          print(f"current={current}")
          print(f"is_current={'true' if norm(current) == norm(os.environ['ADOPTED']) else 'false'}")
          PY
      - name: Read whether the register holds a lag this adoption closes
        id: lag
        env:
          IS_CURRENT: ${{ steps.current.outputs.is_current }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os, pathlib, tomllib
          path = pathlib.Path(os.environ["RUNNER_TEMP"], "governance", "governance", "consumers.toml")
          register = tomllib.loads(path.read_text())
          consumer = next(c for c in register["consumer"] if c["id"] == os.environ["CONSUMER"])
          lag = next((r.get("lag") for r in consumer.get("libraries", []) if r["library"] == os.environ["LIBRARY"]), None)
          current = os.environ["IS_CURRENT"] == "true"
          print(f"closes={'true' if lag and current else 'false'}")
          print(f"held={'true' if lag and not current else 'false'}")
          print(f"tracked={(lag or {}).get('issue') or (lag or {}).get('reason') or ''}")
          PY
      - name: Run tests
        id: tests
        continue-on-error: true
        run: |
          uv run pytest 2>&1 | tee "$RUNNER_TEMP/bump-test-output.txt"
      - name: Ask Claude to repair test failures
        if: steps.tests.outcome == 'failure'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            idfkit was bumped to ${{ steps.ver.outputs.version }}, and the test suite failed.
            Task:
            - Read the failure output at ${{ runner.temp }}/bump-test-output.txt.
            - Diagnose the compatibility issue caused by the idfkit upgrade.
            - Make the minimal code changes required.
            - Do not refactor unrelated code.
            - Preserve public APIs unless the idfkit upgrade requires a change.
            - Rerun: uv run pytest
            - Leave a concise summary of root cause, changed files, and final test result.
      - name: Rerun tests after Claude repair
        if: steps.tests.outcome == 'failure'
        run: uv run pytest
      - name: Write the pull request body
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          PREVIOUS: ${{ steps.prev.outputs.level }}
          TESTS: ${{ steps.tests.outcome }}
          SURFACED: ${{ steps.statements.outputs.surfaced }}
          CLOSES: ${{ steps.lag.outputs.closes }}
          TRACKED: ${{ steps.lag.outputs.tracked }}
          HELD: ${{ steps.lag.outputs.held }}
          CURRENT: ${{ steps.current.outputs.current }}
        run: |
          {
            echo "Automated idfkit dependency bump."
            echo "- Version: \`$VERSION\`, from \`$PREVIOUS\`"
            echo "- Initial test result: \`$TESTS\`"
            echo "- Test command: \`uv run pytest\`"
            echo
            echo "If tests initially failed, Claude attempted a minimal compatibility repair."
            echo
            echo "### Statements of unavailability"
            if [ "$SURFACED" = true ]; then
              echo "**This adoption is not complete.** The new level closes a capability that a statement in this repository says is unavailable. Remove each statement, or set its \`own_reason\` so it stops citing the library, then mark this pull request ready (FR-025):"
              echo
              echo '```'
              cat "$RUNNER_TEMP/statements.txt"
              echo '```'
            else
              echo "None of this repository's statements rests on a capability this level closed."
            fi
            echo
            echo "### Consumer register"
            if [ "$CLOSES" = true ]; then
              echo "The register holds a lag for \`$CONSUMER\` ($LIBRARY), tracked at $TRACKED. This adoption closes it."
              if [ "$HAS_APP" = true ]; then
                echo "A paired pull request in idfkit-conformance removes it; merge the two together (FR-023)."
              else
                echo "Record that in a paired pull request, which needs this run in idfkit-conformance:"
                echo
                echo '```'
                echo "gh workflow run record-adoption.yml --repo idfkit/idfkit-conformance -f consumer=$CONSUMER -f library=$LIBRARY -f outcome=close-lag -f adoption=<this pull request's URL>"
                echo '```'
              fi
            elif [ "$HELD" = true ]; then
              echo "The register holds a lag for \`$CONSUMER\` ($LIBRARY), tracked at $TRACKED, and this adoption does not close it: \`$VERSION\` is not the library's current level, \`$CURRENT\`. The consumer moves forward and is still behind, so the lag stays open (FR-023)."
            else
              echo "Nothing to record: the register points at pyproject.toml and holds no level, and no lag for this repository."
            fi
          } > "$RUNNER_TEMP/pr-body.md"
      - name: Open PR
        id: pr
        uses: peter-evans/create-pull-request@v6
        with:
          branch: bot/bump-idfkit-${{ steps.ver.outputs.version }}
          title: "Bump idfkit to ${{ steps.ver.outputs.version }}"
          commit-message: "Bump idfkit to ${{ steps.ver.outputs.version }}"
          reviewers: samuelduchesne
          draft: ${{ steps.statements.outputs.surfaced == 'true' }}
          body-path: ${{ runner.temp }}/pr-body.md
      # The consumer register lives in idfkit-conformance, so recording an adoption there is a dispatch
      # into another repository. The organisation's GitHub App (idfkit-bot) mints a token for that one
      # repository, valid for an hour, rather than a personal token stored for months. Without APP_ID
      # and APP_PRIVATE_KEY this step is skipped and the steps below say what to run instead.
      - name: Mint a token that can dispatch in idfkit-conformance
        id: app-token
        if: env.HAS_APP == 'true'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: idfkit-conformance
      - name: Record the closed lag in the register
        if: steps.lag.outputs.closes == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning title=Register not updated::APP_ID and APP_PRIVATE_KEY are not set. The pull request body carries the command that records the closed lag."
            exit 0
          fi
          gh workflow run record-adoption.yml --repo idfkit/idfkit-conformance \
            -f consumer="$CONSUMER" -f library="$LIBRARY" -f outcome=close-lag -f adoption="$PR_URL"
      - name: Refuse to call the adoption complete while a statement is unreviewed
        if: steps.statements.outputs.surfaced == 'true'
        run: |
          echo "::error title=Statements unreviewed::This adoption surfaced statements of unavailability that the new level made false. The pull request is a draft until each is reviewed."
          exit 1
