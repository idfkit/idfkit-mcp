# Reference models (FR-041, research R-14): EnergyPlus ExampleFiles pinned by file name, resolved
# under $ENERGYPLUS_DIR/ExampleFiles. Each fault type runs on every model sharing one of its
# applies_to tags, in this order, capped at 8 models per type.
#
# Tags are taken from the object types each file contains (comments stripped):
#   vav_reheat     AirTerminal:SingleDuct:VAV:Reheat
#   chilled_water  a Chiller:* object
#   hot_water      Boiler:HotWater
#   water_coil     Coil:Heating:Water, Coil:Cooling:Water or Coil:Cooling:Water:DetailedGeometry
#   packaged_unit  ZoneHVAC:PackagedTerminalAirConditioner/HeatPump, AirLoopHVAC:UnitarySystem,
#                  AirLoopHVAC:UnitaryHeatCool, AirLoopHVAC:UnitaryHeatPump:AirToAir,
#                  AirLoopHVAC:Unitary:Furnace:HeatCool/HeatOnly or AirLoopHVAC:UnitaryHeatOnly
#   zone_list      ZoneList
#   hvac_template  any HVACTemplate:* object (these files hold no expanded loops, so no loop tags)
#   air_loop       AirLoopHVAC
#   plant_loop     PlantLoop
#   dx_cooling     a Coil:Cooling:DX* object
#   hw_no_reheat   AirTerminal:SingleDuct:VAV:NoReheat or :ConstantVolume:NoReheat, and Boiler:HotWater
#                  (a terminal a hot-water reheat coil can be added to; authoring task add_reheat_coil)
#   cv_fan         a Fan:ConstantVolume on the branches of an AirLoopHVAC (authoring task cv_to_vav_fan)
#
# File names were verified against the EnergyPlus 26.1 ExampleFiles; version is the 26.2 level the
# evaluation targets (contracts/eval-harness.md).

